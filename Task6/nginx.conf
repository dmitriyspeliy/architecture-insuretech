http {
    # Общая зона лимитирования.
    # $binary_remote_addr — ключ лимита по IP клиента.
    # 10r/m — не более 10 запросов в минуту.
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки.
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        # Возвращаем HTTP 429 Too Many Requests при превышении лимита.
        limit_req_status 429;

        location / {
            # Применяем лимит к запросам.
            # burst=0 означает, что лишние запросы сразу отклоняются без очереди.
            limit_req zone=partner_limit burst=0 nodelay;

            proxy_pass http://backend_servers;
        }
    }
}
